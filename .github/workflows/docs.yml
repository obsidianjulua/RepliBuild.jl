name: Docs

on:
  push:
    branches:
      - main
    tags: '*'
    # Only rebuild + redeploy docs when something that can change the rendered
    # docs actually changes: the doc sources, or the docstrings they pull from.
    # Chore/test/UI/README commits no longer spawn a gh-pages "build based on X".
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/docs.yml'

# One docs build per ref; a newer push cancels an in-flight build so rapid
# successive commits collapse into a single deploy instead of a queue of them.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Configure doc environment
        shell: julia --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Documenter only creates /stable/ from a v* tag. This repo has none, so
      # the README stable badge 404s while /dev/ (main) is the live manual.
      # Until a tag exists, copy /dev/ → /stable/ after each main deploy.
      # Once tags exist, Documenter owns /stable/ and this step no-ops.
      - name: Mirror /dev/ to /stable/
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin 'refs/tags/v*' | grep -q .; then
            echo "Version tags exist; Documenter owns /stable/"
            exit 0
          fi
          git clone --branch gh-pages --single-branch --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages-work
          cd gh-pages-work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -d dev
          rm -rf stable
          cp -a dev stable
          printf '%s\n' \
            'var DOC_VERSIONS = [' \
            '  "stable",' \
            '  "dev",' \
            '];' \
            'var DOCUMENTER_NEWEST = "dev";' \
            'var DOCUMENTER_STABLE = "stable";' \
            > versions.js
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html><head>' \
            '<meta http-equiv="refresh" content="0; url=./stable/"/>' \
            '<link rel="canonical" href="https://obsidianjulua.github.io/RepliBuild.jl/stable/"/>' \
            '</head></html>' \
            > index.html
          git add -A
          if git diff --cached --quiet; then
            echo "stable already in sync with dev"
          else
            git commit -m "Mirror /dev/ → /stable/"
            git push
          fi
      - name: Run doctests
        shell: julia --project=docs {0}
        run: |
          using Documenter: DocMeta, doctest
          using RepliBuild
          DocMeta.setdocmeta!(RepliBuild, :DocTestSetup, :(using RepliBuild); recursive=true)
          doctest(RepliBuild)
