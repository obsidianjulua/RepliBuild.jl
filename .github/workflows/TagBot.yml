name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        description: "[DEPRECATED] No longer has any effect"
        default: "3"
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    # ubuntu-slim doesn't support containers, and thus won't work
    runs-on: ubuntu-latest
    # TagBot's README recommends the repository's default token permissions.
    # This repository's default is read-only, and a workflow that writes asks
    # for it here, as docs.yml does: write only where TagBot creates things.
    permissions:
      actions: read
      checks: read
      contents: write        # tags and releases
      deployments: read
      discussions: read
      issues: write          # the issue TagBot opens when it cannot release
      packages: read
      pages: read
      pull-requests: read    # the changelog lists merged pull requests
      repository-projects: read
      security-events: read
      statuses: read
    steps:
      - uses: JuliaRegistries/TagBot@a3a48fad3c1d6c2abbb874970a3f9032493a7473 # v1.25.14
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # For commits that modify workflow files: SSH key enables tagging, but
          # releases require manual creation. For full automation of such commits,
          # use a PAT with `workflow` scope instead of GITHUB_TOKEN.
          # See: https://github.com/JuliaRegistries/TagBot#commits-that-modify-workflow-files
          # The deploy key's push is what triggers docs.yml on the new tag;
          # a tag pushed with GITHUB_TOKEN starts no workflow.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
